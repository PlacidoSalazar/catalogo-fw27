<script>
const t=document.getElementById('t'),n=t.children.length;let i=0,lock=false;
const go=k=>{k=Math.max(0,Math.min(n-1,k));if(k===i)return;i=k;lock=true;t.style.transform=`translateY(${-i*100}%)`;t.style.transform=`translateY(${-i*innerHeight}px)`;setTimeout(()=>lock=false,1000);};
addEventListener('wheel',e=>{e.preventDefault();if(lock||Math.abs(e.deltaY)<8)return;go(i+(e.deltaY>0?1:-1));},{passive:false});
let y0=null;addEventListener('touchstart',e=>y0=e.touches[0].clientY,{passive:true});
addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
addEventListener('touchend',e=>{if(y0===null||lock)return;const d=y0-e.changedTouches[0].clientY;if(Math.abs(d)>40)go(i+(d>0?1:-1));y0=null;});
addEventListener('keydown',e=>{if(['ArrowDown','ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();lock||go(i+1)}
 if(['ArrowUp','ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();lock||go(i-1)}
 if(e.key==='Home')go(0);if(e.key==='End')go(n-1);
 if(e.key==='f')document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();});
addEventListener('resize',()=>{t.style.transition='none';t.style.transform=`translateY(${-i*innerHeight}px)`;requestAnimationFrame(()=>t.style.transition='')});
</script></body></html>
