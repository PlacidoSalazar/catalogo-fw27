<script>
const t=document.getElementById('t'),n=t.children.length;let i=0,lock=false,last=0,moving=false;
t.querySelectorAll('img').forEach(m=>{m.decoding='async';m.decode&&m.decode().catch(()=>{})});
const free=()=>{if(moving)return;if(performance.now()-last<140){setTimeout(free,60)}else lock=false};
const go=k=>{k=Math.max(0,Math.min(n-1,k));if(k===i)return;i=k;lock=true;moving=true;last=performance.now();t.style.transform=`translate3d(0,${-i*innerHeight}px,0)`;};
t.addEventListener('transitionend',e=>{if(e.target!==t)return;moving=false;free()});
addEventListener('wheel',e=>{e.preventDefault();const d=e.deltaY;if(Math.abs(d)<2)return;last=performance.now();if(lock)return;if(Math.abs(d)<8)return;go(i+(d>0?1:-1));},{passive:false});
let y0=null;addEventListener('touchstart',e=>y0=e.touches[0].clientY,{passive:true});
addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
addEventListener('touchend',e=>{if(y0===null||lock)return;const d=y0-e.changedTouches[0].clientY;if(Math.abs(d)>40){go(i+(d>0?1:-1));setTimeout(()=>{moving=false;free()},1150)}y0=null;});
addEventListener('keydown',e=>{if(['ArrowDown','ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();lock||(go(i+1),setTimeout(()=>{moving=false;free()},1150))}
 if(['ArrowUp','ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();lock||(go(i-1),setTimeout(()=>{moving=false;free()},1150))}
 if(e.key==='Home')go(0);if(e.key==='End')go(n-1);
 if(e.key==='f')document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();});
addEventListener('resize',()=>{t.style.transition='none';t.style.transform=`translate3d(0,${-i*innerHeight}px,0)`;requestAnimationFrame(()=>t.style.transition='')});
</script></body></html>
